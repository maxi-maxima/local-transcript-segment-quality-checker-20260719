name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python tests/test_main.py
      - run: python -m py_compile src/main.py tests/test_main.py
      - run: python -m src.main examples/transcript.txt --max-seconds 20 --fail-on-issues
